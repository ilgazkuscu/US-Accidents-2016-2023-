[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "us-accidents-analysis"
version = "0.1.0"
description = "Reusable data preparation and statistical utilities for U.S. accident severity analysis"
requires-python = ">=3.10"
dependencies = [
  "dash>=2.18",
  "dash-bootstrap-components>=1.6",
  "numpy>=1.26",
  "pandas>=2.0",
  "plotly>=5.20",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

